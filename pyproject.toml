[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curveforge"
version = "1.0.2"
description = "A graphics-first mathematical curve library powered by NumPy and Matplotlib."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "CurveForge Contributors" }]
keywords = ["curves", "mathematics", "plotting", "geometry", "numpy", "matplotlib"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/iampremacharya/CurveForge"
Repository = "https://github.com/iampremacharya/CurveForge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
